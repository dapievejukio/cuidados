<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — ORAQUI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#263442;margin:0}header{background:#6d80a8;color:white;padding:22px 18px}main{max-width:760px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #25313c10}button,a.btn{border:0;background:#7567b9;color:white;border-radius:10px;padding:12px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700}button:disabled{opacity:.45}select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5dc;border-radius:10px;margin:8px 0}label{display:block;padding:9px 0;border-bottom:1px solid #eef1f4}small,.hint{color:#697989}#mensagens{height:42vh;overflow:auto;background:#f8f9fb;padding:10px;border-radius:12px;margin:12px 0}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#e5ecf3;max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}.minha{margin-left:auto;background:#e6defb}.msg small{display:block;margin-top:6px}#status{margin:12px 0;color:#8a3e3e}h1{margin:0;font-size:22px}</style></head><body><header><h1>💬 ORAQUI — Mensagens</h1></header><main><section><a class="btn" href="javascript:history.back()">← VOLTAR</a><h2>⚙️ Permissões do chat</h2><p class="hint">Gestores podem conversar com colaboradores. Escolha se os colaboradores também podem conversar entre si.</p><p id="status"></p><label><input type="radio" name="modo" value="todos"> Liberar conversa entre todos os colaboradores deste condomínio</label><label><input type="radio" name="modo" value="limitado"> Limitar conversa entre colaboradores (selecionar abaixo)</label><h3>Colaboradores autorizados no modo limitado</h3><div id="lista"></div><button id="salvar">SALVAR PERMISSÕES</button></section></main><script>const db=supabase.createClient('https://rhiosvsohvqqrxzwohqu.supabase.co','sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const cid=Number(new URLSearchParams(location.search).get('condominio_id'));let uid=null;const falha=e=>{$('status').textContent=e?.message||String(e)};
let colaboradores=[];
async function init(){try{if(!cid)throw Error('Abra pelas opções do gestor.');const {data:{user},error}=await db.auth.getUser();if(error||!user)throw Error('Faça login no ORAQUI.');uid=user.id;const {data:g,error:ge}=await db.from('usuarios_gestao').select('id,perfil').eq('condominio_id',cid).eq('auth_user_id',uid).eq('ativo',true);if(ge)throw ge;if(!g?.length)throw Error('Somente gestores deste condomínio podem configurar o chat.');const [c,cf,ps]=await Promise.all([db.from('colaboradores').select('id,nome,ativo').eq('condominio_id',cid).eq('ativo',true).order('nome'),db.from('oraqui_chat_config').select('modo').eq('condominio_id',cid).maybeSingle(),db.from('oraqui_chat_permissoes').select('colaborador_id,liberado').eq('condominio_id',cid)]);for(const r of [c,cf,ps])if(r.error)throw r.error;colaboradores=c.data||[];const autorizados=new Set((ps.data||[]).filter(x=>x.liberado).map(x=>x.colaborador_id));document.querySelector(`input[name=modo][value=${cf.data?.modo||'limitado'}]`).checked=true;$('lista').innerHTML=colaboradores.map(x=>`<label><input type="checkbox" data-id="${x.id}" ${autorizados.has(x.id)?'checked':''}> ${esc(x.nome)}</label>`).join('')||'Nenhum colaborador ativo.';}catch(e){falha(e)}}
$('salvar').onclick=async()=>{ $('salvar').disabled=true;try{const modo=document.querySelector('input[name=modo]:checked')?.value;if(!modo)throw Error('Escolha o modo.');const {error}=await db.from('oraqui_chat_config').upsert({condominio_id:cid,modo,atualizado_em:new Date().toISOString()},{onConflict:'condominio_id'});if(error)throw error;const linhas=[...document.querySelectorAll('[data-id]')].map(x=>({condominio_id:cid,colaborador_id:Number(x.dataset.id),liberado:x.checked}));if(linhas.length){const r=await db.from('oraqui_chat_permissoes').upsert(linhas,{onConflict:'condominio_id,colaborador_id'});if(r.error)throw r.error}$('status').textContent='✓ Permissões salvas.'}catch(e){falha(e)}finally{$('salvar').disabled=false}};
init();</script></body></html>
