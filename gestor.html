<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gestão — CUIDADOS</title>

<meta
    name="theme-color"
    content="#12355b"
>

<style>

:root {

    --primary:#12355b;
    --primary-dark:#0b2745;
    --primary-light:#eaf2fb;

    --green:#178c58;
    --green-light:#e8f6ef;

    --yellow:#d89b19;
    --yellow-light:#fff5d9;

    --red:#d94b4b;
    --red-light:#fdecec;

    --text:#17202a;
    --muted:#687483;

    --background:#f4f7fa;
    --card:#ffffff;
    --border:#e2e8ef;

    --shadow:
        0 10px 30px
        rgba(20,45,75,.08);

}

* {

    box-sizing:border-box;

    margin:0;
    padding:0;

}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    min-height:100vh;

}

button {

    font-family:inherit;

}

/* ==========================
   HEADER
========================== */

header {

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    color:white;

    padding:
        calc(
            17px +
            env(safe-area-inset-top)
        )
        18px
        36px;

}

.header-content {

    max-width:1100px;

    margin:auto;

}

.topbar {

    display:flex;

    align-items:center;

    justify-content:
        space-between;

}

.brand {

    display:flex;

    align-items:center;

    gap:11px;

}

.logo {

    width:43px;
    height:43px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.14);

    font-size:21px;

    font-weight:800;

}

.brand h1 {

    font-size:18px;

    letter-spacing:.7px;

}

.brand small {

    display:block;

    margin-top:2px;

    opacity:.7;

    font-size:10px;

}

.manager {

    width:43px;
    height:43px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.14);

    font-size:18px;

}

.welcome {

    margin-top:28px;

}

.welcome small {

    opacity:.7;

    font-size:11px;

}

.welcome h2 {

    margin-top:4px;

    font-size:27px;

}

.welcome p {

    margin-top:5px;

    opacity:.72;

    font-size:11px;

}

/* ==========================
   MAIN
========================== */

main {

    max-width:1100px;

    margin:-15px auto 100px;

    padding:0 15px;

}

/* ==========================
   MANAGEMENT CARD
========================== */

.manager-card {

    background:white;

    border-radius:20px;

    padding:16px;

    box-shadow:
        var(--shadow);

    display:flex;

    align-items:center;

    gap:12px;

}

.manager-icon {

    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--primary-light);

    font-size:22px;

}

.manager-info {

    flex:1;

}

.manager-info small {

    color:
        var(--muted);

    font-size:9px;

}

.manager-info strong {

    display:block;

    margin-top:2px;

    font-size:14px;

}

.manager-tag {

    padding:6px 9px;

    border-radius:20px;

    background:
        var(--primary-light);

    color:
        var(--primary);

    font-size:9px;

    font-weight:700;

}

/* ==========================
   KPIs
========================== */

.kpis {

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-top:14px;

}

.kpi {

    background:white;

    border-radius:17px;

    padding:15px 10px;

    box-shadow:
        var(--shadow);

    text-align:center;

}

.kpi-number {

    font-size:25px;

    font-weight:750;

}

.kpi-label {

    display:block;

    margin-top:4px;

    color:
        var(--muted);

    font-size:9px;

}

.green {

    color:
        var(--green);

}

.yellow {

    color:
        var(--yellow);

}

.red {

    color:
        var(--red);

}

.blue {

    color:
        var(--primary);

}

/* ==========================
   SECTION
========================== */

.section {

    margin-top:27px;

}

.section-header {

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    margin-bottom:11px;

}

.section-header h3 {

    font-size:17px;

}

.section-header span {

    color:
        var(--muted);

    font-size:10px;

}

/* ==========================
   TOWER
========================== */

.tower-card {

    background:white;

    border-radius:20px;

    padding:19px;

    box-shadow:
        var(--shadow);

}

.tower-top {

    display:flex;

    align-items:center;

    gap:13px;

}

.tower-icon {

    width:50px;
    height:50px;

    flex-shrink:0;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--primary-light);

    font-size:24px;

}

.tower-info {

    flex:1;

}

.tower-info small {

    color:
        var(--muted);

    font-size:9px;

}

.tower-info h4 {

    margin-top:2px;

    font-size:18px;

}

.tower-responsible {

    padding:6px 9px;

    border-radius:20px;

    background:
        var(--green-light);

    color:
        var(--green);

    font-size:9px;

    font-weight:700;

}

.progress-header {

    display:flex;

    justify-content:
        space-between;

    margin-top:18px;

    font-size:10px;

}

.progress-header span {

    color:
        var(--muted);

}

.progress-header strong {

    color:
        var(--green);

}

.progress {

    height:9px;

    margin-top:8px;

    border-radius:20px;

    background:#e8edf2;

    overflow:hidden;

}

.progress-fill {

    width:0%;

    height:100%;

    background:
        var(--green);

    transition:.4s;

}

.tower-details {

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-top:15px;

}

.tower-detail {

    padding:10px;

    border-radius:13px;

    background:#f7f9fb;

    text-align:center;

}

.tower-detail strong {

    display:block;

    font-size:14px;

}

.tower-detail span {

    display:block;

    margin-top:2px;

    color:
        var(--muted);

    font-size:8px;

}

/* ==========================
   OCCURRENCES
========================== */

.occurrence {

    background:white;

    border-radius:18px;

    padding:16px;

    margin-bottom:10px;

    box-shadow:
        0 6px 20px
        rgba(20,45,75,.06);

}

.occurrence-top {

    display:flex;

    align-items:flex-start;

    gap:11px;

}

.occurrence-icon {

    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--red-light);

    font-size:19px;

}

.occurrence-main {

    flex:1;

    min-width:0;

}

.occurrence-main strong {

    display:block;

    font-size:13px;

}

.occurrence-main p {

    margin-top:4px;

    color:
        var(--muted);

    font-size:10px;

    line-height:1.5;

    word-break:break-word;

}

.protocol {

    margin-top:5px;

    color:#98a2ad;

    font-size:8px;

}

.status {

    flex-shrink:0;

    padding:6px 8px;

    border-radius:20px;

    font-size:8px;

    font-weight:700;

}

.status-open {

    background:
        var(--red-light);

    color:
        var(--red);

}

.status-progress {

    background:
        var(--yellow-light);

    color:#996400;

}

.status-done {

    background:
        var(--green-light);

    color:
        var(--green);

}

.occurrence-data {

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:12px;

}

.data-tag {

    padding:6px 8px;

    border-radius:10px;

    background:#f5f7f9;

    color:
        var(--muted);

    font-size:8px;

}

.occurrence-actions {

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-top:13px;

}

.action {

    border:0;

    border-radius:12px;

    padding:11px;

    font-size:9px;

    font-weight:700;

    cursor:pointer;

}

.action-progress {

    background:
        var(--yellow-light);

    color:#8d6200;

}

.action-done {

    background:
        var(--green-light);

    color:
        var(--green);

}

.action-reopen {

    grid-column:
        1 / -1;

    background:
        var(--red-light);

    color:
        var(--red);

}

/* ==========================
   ACTIVITY
========================== */

.activity {

    background:white;

    border-radius:17px;

    padding:14px;

    margin-bottom:9px;

    display:flex;

    align-items:center;

    gap:11px;

    box-shadow:
        0 5px 18px
        rgba(20,45,75,.05);

}

.activity-icon {

    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--green-light);

    font-size:19px;

}

.activity-info {

    flex:1;

}

.activity-info strong {

    display:block;

    font-size:12px;

}

.activity-info span {

    display:block;

    margin-top:3px;

    color:
        var(--muted);

    font-size:9px;

}

.activity-check {

    color:
        var(--green);

    font-size:19px;

    font-weight:800;

}

/* ==========================
   EMPTY
========================== */

.empty {

    background:white;

    border-radius:18px;

    padding:25px;

    text-align:center;

    box-shadow:
        var(--shadow);

    color:
        var(--muted);

}

.empty-icon {

    font-size:30px;

}

.empty strong {

    display:block;

    margin-top:7px;

    color:
        var(--text);

    font-size:13px;

}

.empty p {

    margin-top:4px;

    font-size:9px;

    line-height:1.5;

}

/* ==========================
   RESET
========================== */

.test-tools {

    margin-top:28px;

    padding-top:18px;

    border-top:
        1px solid
        var(--border);

}

.reset-button {

    width:100%;

    border:0;

    border-radius:14px;

    padding:13px;

    background:#edf1f4;

    color:
        var(--muted);

    font-size:9px;

    cursor:pointer;

}

/* ==========================
   BOTTOM NAV
========================== */

.bottom-nav {

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:
        space-around;

    background:white;

    border-top:
        1px solid
        var(--border);

    padding-bottom:
        env(safe-area-inset-bottom);

}

.nav-item {

    text-align:center;

    color:
        var(--muted);

    font-size:8px;

}

.nav-icon {

    display:block;

    margin-bottom:3px;

    font-size:19px;

}

.nav-active {

    color:
        var(--primary);

    font-weight:700;

}

/* ==========================
   DESKTOP
========================== */

@media (min-width:750px) {

    .occurrences-grid {

        display:grid;

        grid-template-columns:
            1fr 1fr;

        gap:10px;

    }

    .occurrence {

        margin-bottom:0;

    }

    .activities-grid {

        display:grid;

        grid-template-columns:
            1fr 1fr;

        gap:9px;

    }

    .activity {

        margin-bottom:0;

    }

    .bottom-nav {

        max-width:1100px;

        left:50%;

        transform:
            translateX(-50%);

        border-radius:
            20px 20px 0 0;

    }

}

@media (max-width:500px) {

    .kpis {

        grid-template-columns:
            1fr 1fr;

    }

}

</style>

</head>

<body>


<header>

<div class="header-content">

    <div class="topbar">

        <div class="brand">

            <div class="logo">
                ✓
            </div>

            <div>

                <h1>
                    CUIDADOS
                </h1>

                <small>
                    Painel de Gestão
                </small>

            </div>

        </div>


        <div class="manager">
            👤
        </div>

    </div>


    <div class="welcome">

        <small>
            Reserva Igara
        </small>

        <h2>
            Visão da operação
        </h2>

        <p>
            Limpeza, equipe e ocorrências em um só lugar.
        </p>

    </div>

</div>

</header>


<main>


<!-- GESTOR -->

<div class="manager-card">

    <div class="manager-icon">
        📊
    </div>

    <div class="manager-info">

        <small>
            PERFIL
        </small>

        <strong>
            Gestão • Reserva Igara
        </strong>

    </div>

    <span class="manager-tag">
        Gestor
    </span>

</div>


<!-- KPIs -->

<div class="kpis">

    <div class="kpi">

        <div
            class="kpi-number green"
            id="kpiCompleted"
        >
            0
        </div>

        <span class="kpi-label">
            Limpezas concluídas
        </span>

    </div>


    <div class="kpi">

        <div
            class="kpi-number red"
            id="kpiOpen"
        >
            0
        </div>

        <span class="kpi-label">
            Ocorrências abertas
        </span>

    </div>


    <div class="kpi">

        <div
            class="kpi-number yellow"
            id="kpiProgress"
        >
            0
        </div>

        <span class="kpi-label">
            Em atendimento
        </span>

    </div>


    <div class="kpi">

        <div
            class="kpi-number blue"
            id="kpiResolved"
        >
            0
        </div>

        <span class="kpi-label">
            Resolvidas
        </span>

    </div>

</div>


<!-- TORRE E -->

<section class="section">

    <div class="section-header">

        <h3>
            Operação
        </h3>

        <span>
            Hoje
        </span>

    </div>


    <div class="tower-card">

        <div class="tower-top">

            <div class="tower-icon">
                🏢
            </div>


            <div class="tower-info">

                <small>
                    RESERVA IGARA
                </small>

                <h4>
                    Torre E
                </h4>

            </div>


            <span class="tower-responsible">
                Débora
            </span>

        </div>


        <div class="progress-header">

            <span>
                Rotina de limpeza
            </span>

            <strong
                id="towerPercent"
            >
                0%
            </strong>

        </div>


        <div class="progress">

            <div
                class="progress-fill"
                id="towerProgress"
            ></div>
