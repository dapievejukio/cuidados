<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha foto — ORAQUI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5fa;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2d3140}header{background:linear-gradient(125deg,#6d80a8,#7c72ae);color:#fff;padding:28px 20px 65px}header h1{margin:8px auto;max-width:560px;font-size:25px}main{max-width:560px;margin:-38px auto 30px;padding:0 15px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 28px #24234b16;text-align:center}.avatar{width:126px;height:126px;margin:12px auto;border-radius:50%;background:#eeeafb;display:grid;place-items:center;font-size:58px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;margin:12px 0;background:#7667b9;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.btn.secondary{background:#f0eef9;color:#6558a5}.btn:disabled{opacity:.6}small{display:block;color:#72788b;line-height:1.6}#status{margin-top:14px;min-height:25px}</style></head><body><header><h1>📷 Minha foto</h1></header><main><div class="card"><div class="avatar" id="avatar">👤</div><strong id="nome">Carregando...</strong><p>Escolha uma foto para seu perfil no ORAQUI.</p><input type="file" id="arquivo" accept="image/jpeg,image/png,image/webp" style="display:none"><button class="btn" id="selecionar">📷 Tirar ou escolher foto</button><button class="btn secondary" id="salvar" disabled>Salvar foto</button><a href="colaborador.html" style="color:#6558a5">← Voltar ao painel</a><small>Máximo de 5 MB. Sua foto é visível para você e para gestores autorizados do condomínio.</small><div id="status" role="status"></div></div></main><script>
const db=supabase.createClient('https://rhiosvsohvqqrxzwohqu.supabase.co', 'sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt');
const $=id=>document.getElementById(id);let col=null,blob=null;
async function iniciar(){const {data:{user}}=await db.auth.getUser();if(!user){$('status').textContent='Faça login no ORAQUI primeiro.';return}const {data,error}=await db.from('colaboradores').select('id,nome,foto_perfil_path').eq('auth_user_id',user.id).eq('ativo',true).limit(1).maybeSingle();if(error||!data){$('status').textContent='Cadastro de colaborador não encontrado.';return}col=data;$('nome').textContent=data.nome;if(data.foto_perfil_path){const {data:u}=await db.storage.from('fotos-perfil-privadas').createSignedUrl(data.foto_perfil_path,3600);if(u?.signedUrl)mostrar(u.signedUrl)}}
function mostrar(url){$('avatar').textContent='';const img=document.createElement('img');img.alt='Foto do colaborador';img.src=url;$('avatar').append(img)}
$('selecionar').onclick=()=>$('arquivo').click();$('arquivo').onchange=()=>{const f=$('arquivo').files[0];if(!f)return;if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type)){$('status').textContent='Use JPG, PNG ou WEBP com até 5 MB.';return}blob=f;mostrar(URL.createObjectURL(f));$('salvar').disabled=false};
$('salvar').onclick=async()=>{if(!col||!blob)return;$('salvar').disabled=true;$('status').textContent='Enviando foto...';try{const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';const path=col.id+'/'+crypto.randomUUID()+'.'+ext;const {error:e}=await db.storage.from('fotos-perfil-privadas').upload(path,blob,{contentType:blob.type,upsert:false});if(e)throw e;const {error:r}=await db.rpc('oraqui_atualizar_minha_foto',{p_colaborador_id:col.id,p_path:path});if(r)throw r;$('status').textContent='Foto salva. Volte ao painel e atualize a página.'}catch(e){$('status').textContent='Erro: '+e.message;$('salvar').disabled=false}};iniciar();
</script></body></html>
