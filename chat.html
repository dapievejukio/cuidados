<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — ORAQUI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#263442;margin:0}header{background:#6d80a8;color:white;padding:22px 18px}main{max-width:760px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #25313c10}button,a.btn{border:0;background:#7567b9;color:white;border-radius:10px;padding:12px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700}button:disabled{opacity:.45}select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5dc;border-radius:10px;margin:8px 0}label{display:block;padding:9px 0;border-bottom:1px solid #eef1f4}small,.hint{color:#697989}#mensagens{height:42vh;overflow:auto;background:#f8f9fb;padding:10px;border-radius:12px;margin:12px 0}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#e5ecf3;max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}.minha{margin-left:auto;background:#e6defb}.msg small{display:block;margin-top:6px}#status{margin:12px 0;color:#8a3e3e}h1{margin:0;font-size:22px}</style></head><body><header><h1>💬 ORAQUI — Mensagens</h1></header><main><section><a class="btn" href="javascript:history.back()">← VOLTAR</a><p class="hint">Conversa individual, restrita ao condomínio selecionado.</p><strong id="titulo"></strong><p id="status"></p><select id="contato"><option>Carregando contatos...</option></select></section><section><div id="mensagens"></div><textarea id="texto" rows="3" maxlength="2000" placeholder="Digite sua mensagem..."></textarea><button id="enviar">ENVIAR MENSAGEM</button><p class="hint">As mensagens são atualizadas automaticamente. Versão inicial: somente texto.</p></section></main><script>const db=supabase.createClient('https://rhiosvsohvqqrxzwohqu.supabase.co','sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const cid=Number(new URLSearchParams(location.search).get('condominio_id'));let uid=null;const falha=e=>{$('status').textContent=e?.message||String(e)};
let contatos=[],timer=null;
async function init(){try{if(!cid)throw Error('Abra o chat pelo painel do ORAQUI.');const {data:{user},error}=await db.auth.getUser();if(error||!user)throw Error('Entre no ORAQUI primeiro.');uid=user.id;const [g,c,co,conf,perm]=await Promise.all([db.from('usuarios_gestao').select('id,auth_user_id,nome,ativo').eq('condominio_id',cid).eq('ativo',true),db.from('colaboradores').select('id,auth_user_id,nome,ativo').eq('condominio_id',cid).eq('ativo',true),db.from('condominios').select('nome').eq('id',cid).single(),db.from('oraqui_chat_config').select('modo').eq('condominio_id',cid).maybeSingle(),db.from('oraqui_chat_permissoes').select('colaborador_id,liberado').eq('condominio_id',cid)]);
for(const r of [g,c,co,conf,perm])if(r.error)throw r.error;
const gestores=g.data||[],colabs=c.data||[],souGestor=gestores.some(x=>x.auth_user_id===uid),souColab=colabs.find(x=>x.auth_user_id===uid);if(!souGestor&&!souColab)throw Error('Sem acesso a este condomínio.');
const modo=conf.data?.modo||'limitado',liberados=new Set((perm.data||[]).filter(x=>x.liberado).map(x=>x.colaborador_id));
const possoColegas=souGestor||modo==='todos'||(souColab&&liberados.has(souColab.id));
contatos=[...gestores.map(x=>({uid:x.auth_user_id,nome:x.nome||'Gestor',tipo:'Gestão'})),...colabs.filter(x=>souGestor||(possoColegas&&(modo==='todos'||liberados.has(x.id)))).map(x=>({uid:x.auth_user_id,nome:x.nome,tipo:'Colaborador'}))].filter(x=>x.uid&&x.uid!==uid);
contatos=[...new Map(contatos.map(x=>[x.uid,x])).values()];$('titulo').textContent=co.data?.nome||'Condomínio';$('contato').innerHTML=contatos.length?contatos.map(x=>`<option value="${esc(x.uid)}">${esc(x.nome)} • ${esc(x.tipo)}</option>`).join(''):'<option value="">Nenhum contato disponível</option>';
$('contato').onchange=carregar;await carregar();timer=setInterval(carregar,6000);
}catch(e){falha(e)}}
async function carregar(){const outro=$('contato').value;if(!uid||!outro)return;const {data,error}=await db.from('oraqui_chat_mensagens').select('id,remetente,destinatario,mensagem,criada_em,lida_em').eq('condominio_id',cid).or(`and(remetente.eq.${uid},destinatario.eq.${outro}),and(remetente.eq.${outro},destinatario.eq.${uid})`).order('criada_em',{ascending:false}).limit(100);if(error){falha(error);return}const el=$('mensagens'),antes=el.scrollTop+el.clientHeight>=el.scrollHeight-60;el.innerHTML=(data||[]).reverse().map(m=>`<div class="msg ${m.remetente===uid?'minha':''}">${esc(m.mensagem)}<small>${new Date(m.criada_em).toLocaleString('pt-BR')}</small></div>`).join('')||'<p class="hint">Nenhuma mensagem nesta conversa.</p>';if(antes)el.scrollTop=el.scrollHeight;
const pendentes=(data||[]).filter(m=>m.destinatario===uid&&!m.lida_em).map(m=>m.id);if(pendentes.length)await db.from('oraqui_chat_mensagens').update({lida_em:new Date().toISOString()}).in('id',pendentes);
}
$('enviar').onclick=async()=>{const texto=$('texto').value.trim(),outro=$('contato').value;if(!texto||!outro)return; $('enviar').disabled=true;try{const {error}=await db.from('oraqui_chat_mensagens').insert({condominio_id:cid,remetente:uid,destinatario:outro,mensagem:texto});if(error)throw error;$('texto').value='';$('status').textContent='';await carregar()}catch(e){falha(e)}finally{$('enviar').disabled=false}};
init();</script></body></html>
