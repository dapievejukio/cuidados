<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — ORAQUI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#263442;margin:0}header{background:#6d80a8;color:white;padding:22px 18px}main{max-width:760px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #25313c10}button,a.btn{border:0;background:#7567b9;color:white;border-radius:10px;padding:12px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700}button:disabled{opacity:.45}select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5dc;border-radius:10px;margin:8px 0}label{display:block;padding:9px 0;border-bottom:1px solid #eef1f4}small,.hint{color:#697989}#mensagens{height:42vh;overflow:auto;background:#f8f9fb;padding:10px;border-radius:12px;margin:12px 0}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#e5ecf3;max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}.minha{margin-left:auto;background:#e6defb}.msg small{display:block;margin-top:6px}#status{margin:12px 0;color:#8a3e3e}h1{margin:0;font-size:22px}</style></head><body><header><h1>💬 ORAQUI — Mensagens</h1></header><main><section><a class="btn" href="gestor.html" id="voltarPainel">← VOLTAR</a><p class="hint">Conversa individual, restrita ao condomínio selecionado.</p><strong id="titulo"></strong><p id="status"></p><select id="contato"><option>Carregando contatos...</option></select></section><section><div id="mensagens"></div><textarea id="texto" rows="3" maxlength="2000" placeholder="Digite sua mensagem..."></textarea><button id="enviar">ENVIAR MENSAGEM</button> <button id="gravarAudio" type="button">🎙️ GRAVAR ÁUDIO</button><div id="audioPreview" style="display:none;margin-top:12px;padding:12px;background:#f0eef9;border-radius:12px"><audio id="audioOuvir" controls style="width:100%"></audio><p id="audioTempo"></p><button id="audioEnviar" type="button">ENVIAR ÁUDIO</button> <button id="audioCancelar" type="button">CANCELAR</button></div><p class="hint">As mensagens são atualizadas automaticamente. Áudios de até 2 minutos, com prévia antes do envio.</p></section></main><script>const db=supabase.createClient('https://rhiosvsohvqqrxzwohqu.supabase.co','sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const parametros=new URLSearchParams(location.search);const cid=Number(parametros.get('condominio_id'));const destinoVolta=parametros.get('voltar')==='colaborador.html'?'colaborador.html':'gestor.html';document.getElementById('voltarPainel').href=destinoVolta;let uid=null;const falha=e=>{$('status').textContent=e?.message||String(e)};
let contatos=[],timer=null,primeiraAbertura=true,contatoAnterior="";
async function init(){try{if(!cid)throw Error('Abra o chat pelo painel do ORAQUI.');const {data:{user},error}=await db.auth.getUser();if(error||!user)throw Error('Entre no ORAQUI primeiro.');uid=user.id;
const [gestao,modulo]=await Promise.all([db.rpc('oraqui_chat_eh_gestor',{cid,uid}),db.rpc('oraqui_modulo_liberado',{p_condominio_id:cid,p_modulo:'chat'})]);
if(gestao.error||modulo.error)throw gestao.error||modulo.error;
if(!gestao.data&&!modulo.data){$('enviar').disabled=true;$('gravarAudio').disabled=true;throw Error('Chat desativado ou acesso não autorizado neste condomínio.');}
const [r,co]=await Promise.all([db.rpc('oraqui_chat_listar_contatos',{p_condominio_id:cid}),db.from('condominios').select('nome').eq('id',cid).single()]);
if(r.error)throw r.error;
if(co.error)throw co.error;
contatos=[...new Map((r.data||[]).map(x=>[x.usuario_id,{uid:x.usuario_id,nome:x.nome,tipo:x.tipo}])).values()];
$('titulo').textContent=co.data?.nome||'Condomínio';
$('contato').innerHTML=contatos.length?'<option value="">Selecione um destinatário...</option>'+contatos.map(x=>`<option value="${esc(x.uid)}">${esc(x.nome)} • ${esc(x.tipo)}</option>`).join(''):'<option value="">Nenhum contato disponível — verifique os acessos e as permissões</option>';
$('contato').onchange=()=>{primeiraAbertura=true;carregar()};
// Prioriza a conversa que recebeu a mensagem não lida mais recente.
// Sem pendências, retoma a conversa mais recente; sem histórico, mantém a seleção manual.
const destinoURL=new URLSearchParams(location.search).get('contato');
if(destinoURL&&contatos.some(c=>c.uid===destinoURL))$('contato').value=destinoURL;
else{
 const {data:recentes,error:erroRecentes}=await db.from('oraqui_chat_mensagens')
  .select('remetente,destinatario,criada_em,lida_em')
  .eq('condominio_id',cid)
  .or(`remetente.eq.${uid},destinatario.eq.${uid}`)
  .order('criada_em',{ascending:false}).limit(200);
 if(erroRecentes)console.warn('Não foi possível selecionar a conversa automaticamente:',erroRecentes);
 else{
  const permitidos=new Set(contatos.map(c=>c.uid));
  const minhas=(recentes||[]).filter(m=>m.remetente===uid||m.destinatario===uid);
  const pendente=minhas.find(m=>m.destinatario===uid&&!m.lida_em&&permitidos.has(m.remetente));
  const ultima=minhas.find(m=>permitidos.has(m.remetente===uid?m.destinatario:m.remetente));
  const escolhido=pendente?.remetente||(ultima?(ultima.remetente===uid?ultima.destinatario:ultima.remetente):null);
  if(escolhido)$('contato').value=escolhido;
 }
}
await carregar();timer=setInterval(carregar,6000);
}catch(e){falha(e)}}
async function carregar(){const outro=$('contato').value;if(!uid||!outro)return;const {data,error}=await db.from('oraqui_chat_mensagens').select('id,remetente,destinatario,mensagem,audio_path,criada_em,lida_em').eq('condominio_id',cid).or(`and(remetente.eq.${uid},destinatario.eq.${outro}),and(remetente.eq.${outro},destinatario.eq.${uid})`).order('criada_em',{ascending:false}).limit(100);if(error){falha(error);return}const el=$('mensagens'),mudou=outro!==contatoAnterior,antes=el.scrollTop+el.clientHeight>=el.scrollHeight-60;el.innerHTML=(data||[]).reverse().map(m=>`<div class="msg ${m.remetente===uid?'minha':''}">${m.audio_path?`<button type="button" class="ouvirAudio" data-path="${esc(m.audio_path)}">▶ Ouvir áudio</button>`:esc(m.mensagem)}<small>${new Date(m.criada_em).toLocaleString('pt-BR')}</small></div>`).join('')||'<p class="hint">Nenhuma mensagem nesta conversa.</p>';if(antes||mudou||primeiraAbertura)el.scrollTop=el.scrollHeight;contatoAnterior=outro;primeiraAbertura=false;
el.querySelectorAll(".ouvirAudio").forEach(btn=>btn.onclick=async()=>{try{btn.disabled=true;const {data,error}=await db.storage.from("oraqui-chat-audios").createSignedUrl(btn.dataset.path,120);if(error)throw error;const player=document.createElement("audio");player.controls=true;player.src=data.signedUrl;btn.replaceWith(player);await player.play().catch(()=>{});}catch(e){falha(e);btn.disabled=false}});const pendentes=(data||[]).filter(m=>m.destinatario===uid&&!m.lida_em).map(m=>m.id);if(pendentes.length)await db.from('oraqui_chat_mensagens').update({lida_em:new Date().toISOString()}).in('id',pendentes);
}
$('enviar').onclick=async()=>{const texto=$('texto').value.trim(),outro=$('contato').value;if(!texto||!outro)return; $('enviar').disabled=true;try{const {error}=await db.from('oraqui_chat_mensagens').insert({condominio_id:cid,remetente:uid,destinatario:outro,mensagem:texto});if(error)throw error;$('texto').value='';$('status').textContent='';await carregar()}catch(e){falha(e)}finally{$('enviar').disabled=false}};
let gravador=null,fluxo=null,partes=[],arquivoAudio=null,tempoAudio=0,contadorAudio=null,urlAudio=null;
function cancelarAudio(){if(contadorAudio)clearInterval(contadorAudio);contadorAudio=null;if(gravador?.state==="recording")gravador.stop();fluxo?.getTracks().forEach(t=>t.stop());gravador=null;fluxo=null;arquivoAudio=null;if(urlAudio)URL.revokeObjectURL(urlAudio);urlAudio=null;$("audioPreview").style.display="none";$("gravarAudio").textContent="🎙️ GRAVAR ÁUDIO"}
$("audioCancelar").onclick=cancelarAudio;
$("gravarAudio").onclick=async()=>{
 if(gravador?.state==="recording"){gravador.stop();return}
 if(!$("contato").value){falha(Error("Selecione um destinatário."));return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){falha(Error("Gravação não disponível neste navegador."));return}
 try{
  cancelarAudio();fluxo=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported(t));
  gravador=new MediaRecorder(fluxo,mime?{mimeType:mime}:undefined);partes=[];tempoAudio=0;
  $("audioPreview").style.display="block";$("audioTempo").textContent="Gravando... 0s";$("audioEnviar").disabled=true;
  gravador.ondataavailable=e=>{if(e.data.size)partes.push(e.data)};
  gravador.onstop=()=>{
   clearInterval(contadorAudio);fluxo?.getTracks().forEach(t=>t.stop());
   arquivoAudio=new Blob(partes,{type:gravador.mimeType||"audio/webm"});
   $("gravarAudio").textContent="🎙️ GRAVAR ÁUDIO";
   if(arquivoAudio.size){urlAudio=URL.createObjectURL(arquivoAudio);$("audioOuvir").src=urlAudio;$("audioEnviar").disabled=false;$("audioTempo").textContent="Pronto: "+tempoAudio+"s. Ouça antes de enviar."}
  };
  gravador.start();$("gravarAudio").textContent="⏹ PARAR";
  contadorAudio=setInterval(()=>{tempoAudio++;$("audioTempo").textContent="Gravando... "+tempoAudio+"s / 120s";if(tempoAudio>=120&&gravador?.state==="recording")gravador.stop()},1000);
 }catch(e){cancelarAudio();falha(e)}
};
$("audioEnviar").onclick=async()=>{
 const destino=$("contato").value;if(!arquivoAudio||!destino)return;
 const btn=$("audioEnviar");btn.disabled=true;
 try{
  const ext=arquivoAudio.type.includes("mp4")?"m4a":"webm";
  const caminho=cid+"/"+uid+"/"+crypto.randomUUID()+"."+ext;
  const {error:up}=await db.storage.from("oraqui-chat-audios").upload(caminho,arquivoAudio,{contentType:arquivoAudio.type,upsert:false});if(up)throw up;
  const {error}=await db.from("oraqui_chat_mensagens").insert({condominio_id:cid,remetente:uid,destinatario:destino,mensagem:"🎙️ Mensagem de voz",audio_path:caminho});if(error)throw error;
  cancelarAudio();$("status").textContent="✓ Áudio enviado.";await carregar();
 }catch(e){falha(e);btn.disabled=false}
};
init();</script></body></html>
