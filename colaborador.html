<style>

:root {

    --primary:#12355b;
    --primary-dark:#0b2745;
    --primary-light:#eaf2fb;

    --green:#178c58;
    --green-light:#e8f6ef;

    --yellow:#d89b19;
    --yellow-light:#fff4d6;

    --red:#d94b4b;
    --red-light:#fdecec;

    --purple:#6654a3;
    --purple-light:#efecf8;

    --text:#17202a;
    --muted:#687483;

    --background:#f4f7fa;
    --card:#ffffff;
    --border:#e2e8ef;

    --shadow:
        0 8px 25px
        rgba(20,45,75,.07);

}

* {

    box-sizing:border-box;
    margin:0;
    padding:0;

}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    min-height:100vh;

}

button {

    font-family:inherit;

}


/* HEADER */

header {

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    color:white;

    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        35px;

}

.header-content {

    max-width:760px;
    margin:auto;

}

.topbar {

    display:flex;
    align-items:center;
    justify-content:space-between;

}

.brand {

    display:flex;
    align-items:center;
    gap:10px;

}

.logo {

    width:43px;
    height:43px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.14);

    font-size:21px;
    font-weight:800;

}

.brand strong {

    display:block;
    font-size:15px;

}

.brand small {

    display:block;

    margin-top:2px;

    opacity:.7;
    font-size:9px;

}

.logout {

    width:42px;
    height:42px;

    border:0;
    border-radius:13px;

    background:
        rgba(255,255,255,.14);

    color:white;
    cursor:pointer;

    font-size:17px;

}

.welcome {

    margin-top:27px;

}

.welcome small {

    opacity:.7;
    font-size:10px;

}

.welcome h1 {

    margin-top:4px;
    font-size:26px;

}

.welcome p {

    margin-top:5px;

    opacity:.72;
    font-size:10px;

}


/* MAIN */

main {

    max-width:760px;

    margin:-15px auto 100px;

    padding:0 15px;

}


/* PROFILE */

.profile {

    background:white;

    border-radius:20px;

    padding:15px;

    display:flex;
    align-items:center;
    gap:12px;

    box-shadow:
        var(--shadow);

}

.avatar {

    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        var(--primary-light);

    font-size:22px;

}

.profile-info {

    flex:1;

}

.profile-info strong {

    display:block;
    font-size:14px;

}

.profile-info span {

    display:block;

    margin-top:3px;

    color:
        var(--muted);

    font-size:9px;

}

.profile-tag {

    padding:6px 9px;

    border-radius:20px;

    background:
        var(--primary-light);

    color:
        var(--primary);

    font-size:8px;
    font-weight:700;

}


/* SUMMARY */

.summary {

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-top:13px;

}

.summary-card {

    background:white;

    border-radius:16px;

    padding:14px 8px;

    text-align:center;

    box-shadow:
        var(--shadow);

}

.summary-card strong {

    display:block;

    font-size:22px;

}

.summary-card span {

    display:block;

    margin-top:3px;

    color:
        var(--muted);

    font-size:8px;

}

.green {

    color:
        var(--green);

}

.yellow {

    color:
        var(--yellow);

}

.blue {

    color:
        var(--primary);

}


/* SECTIONS */

.section {

    margin-top:25px;

}

.section-title {

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:10px;

}

.section-title h2 {

    font-size:16px;

}

.section-title span {

    color:
        var(--muted);

    font-size:9px;

}


/* GROUP */

.group {

    margin-bottom:18px;

}

.group-title {

    display:flex;
    align-items:center;
    gap:7px;

    margin:
        0
        3px
        8px;

    color:
        var(--muted);

    font-size:9px;
    font-weight:750;

    letter-spacing:.4px;

    text-transform:uppercase;

}


/* CARD */

.task {

    width:100%;

    border:0;

    background:white;

    border-radius:17px;

    padding:14px;

    margin-bottom:8px;

    display:flex;

    align-items:center;

    gap:11px;

    text-align:left;

    cursor:pointer;

    box-shadow:
        var(--shadow);

}

.task-icon {

    width:45px;
    height:45px;

    flex-shrink:0;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        var(--primary-light);

    font-size:20px;

}

.task-main {

    flex:1;
    min-width:0;

}

.task-main strong {

    display:block;

    color:
        var(--text);

    font-size:12px;

}

.task-main span {

    display:block;

    margin-top:4px;

    color:
        var(--muted);

    font-size:8px;

    line-height:1.4;

}

.status {

    flex-shrink:0;

    padding:6px 8px;

    border-radius:20px;

    font-size:8px;
    font-weight:700;

}

.pending {

    color:
        #916300;

    background:
        var(--yellow-light);

}

.done {

    color:
        var(--green);

    background:
        var(--green-light);

}

.future {

    color:
        var(--muted);

    background:#eef1f4;

}


/* TOWER */

.tower {

    background:white;

    border-radius:19px;

    padding:17px;

    margin-bottom:10px;

    box-shadow:
        var(--shadow);

}

.tower-top {

    display:flex;

.progress {

    height:7px;

    margin-top:13px;

    border-radius:20px;

    overflow:hidden;

    background:#e8edf2;

}

.progress-fill {

    height:100%;

    width:0%;

.tower-button {

.event-card strong {

/* ==================================================
   ATIVIDADES CONCLUÍDAS
================================================== */

function obterConcluidas() {

    return JSON.parse(
        localStorage.getItem(
            "atividadesConcluidas"
        )
    ) || [];

}


function estaConcluida(
    local
) {

    const concluidas =
        obterConcluidas();


    return concluidas.some(
        item => {

            if (
                typeof item ===
                "string"
            ) {

                return item === local;

            }


            return (
                item.local === local
                &&
                (
                    !item.data
                    ||
                    item.data === dataHoje
                )
            );

        }
    );

}

/* ==================================================
   LIMPEZA MULTI
================================================== */

const estruturaTorres = {

    "Torre A":17,
    "Torre B":17,
    "Torre C":17,
    "Torre D":17,
    "Torre E":17

};


function renderLimpeza() {

    const content =
        document.getElementById(
            "content"
        );


    let html = `

        <section class="section">

            <div class="section-title">

                <h2>
                    Minha rotina
                </h2>

                <span>
                    ${dataHoje}
                </span>

            </div>

    `;


    const torres =
        usuario.atribuicoes.filter(
            item =>
                item.tipo === "torre"
        );


    const espacos =
        usuario.atribuicoes.filter(
            item =>
                item.tipo === "espaco"
        );


    if (
        torres.length > 0
    ) {

        html += `

            <div class="group">

                <div class="group-title">
                    🏢 Torres
                </div>

        `;


        torres.forEach(
            item => {

                const total =
                    estruturaTorres[
                        item.nome
                    ] || 17;


                const concluidas =
                    obterConcluidas()
                    .filter(
                        atividade =>
                            typeof atividade ===
                                "object"
                            &&
                            atividade.torre ===
                                item.nome
                            &&
                            (
                                !atividade.data
                                ||
                                atividade.data ===
                                    dataHoje
                            )
                    )
                    .length;


                const percentual =
                    Math.min(
                        Math.round(
                            (
                                concluidas /
                                total
                            ) * 100
                        ),
                        100
                    );


                html += `

                    <div class="tower">

                        <div
                            class="tower-top"
                        >

                            <div
                                class="tower-icon"
                            >
                                🏢
                            </div>


                            <div
                                class="tower-info"
                            >

                                <small>
                                    RESERVA IGARA
                                </small>

                                <strong>
                                    ${item.nome}
                                </strong>

                            </div>


                            <span
                                class="tower-percent"
                            >
                                ${percentual}%
                            </span>

                        </div>


                        <div
                            class="progress"
                        >

                            <div
                                class="progress-fill"
                                style="
                                    width:
                                    ${percentual}%
                                "
                            ></div>

                        </div>


                        <button
                            class="tower-button"
                            onclick="
                                abrirTorre(
                                    '${item.nome}'
                                )
                            "
                        >
                            ABRIR ROTINA
                        </button>

                    </div>

                `;

            }
        );


        html += `
            </div>
        `;

    }


    if (
        espacos.length > 0
    ) {

        html += `

            <div class="group">

                <div class="group-title">
                    🧹 Espaços
                </div>

                <div class="tasks-grid">

        `;


        espacos.forEach(
            item => {

                html +=
                    criarCard(
                        item.nome,
                        item.icone ||
                            "🧹",
                        "Limpeza programada",
                        estaConcluida(
                            item.nome
                        )
                    );

            }
        );


        html += `

                </div>

            </div>

        `;

    }


    html += `
        </section>
    `;


    content.innerHTML =
        html;


    atualizarContadoresLimpeza();

}

    },

    5:{

        nome:
            "Rua lateral",

        icone:
            "🛣️",

        detalhe:
            "Limpeza semanal da circulação externa"

    }

};


/*
   RESERVAS

   Por enquanto fica vazio.

   Depois o gestor cadastra uma reserva
   e a tarefa aparece automaticamente.
*/

function obterReservasHoje() {

    const reservas =
        JSON.parse(
            localStorage.getItem(
                "reservasLimpeza"
            )
        ) || [];


    return reservas.filter(
        item =>
            item.data ===
            dataHoje
    );

}


/* ==================================================
   RONDA
================================================== */

const rondas = [

    {
        nome:
            "Ronda de iluminação",

        icone:
            "💡",

        detalhe:
            "Verificar pontos apagados ou defeituosos"
    },

    {
        nome:
            "Portas e portões",

        icone:
            "🚪",

        detalhe:
            "Verificar funcionamento e danos aparentes"
    },

    {
        nome:
            "Vazamentos",

        icone:
            "💧",

        detalhe:
            "Verificar água acumulada e vazamentos aparentes"
    },

    {
        nome:
            "Conservação geral",

        icone:
            "🔎",

        detalhe:
            "Danos, objetos abandonados ou riscos"
    }

];


/* ==================================================
   RENDER ZELADORIA
================================================== */

function renderZeladoria() {

    const content =
        document.getElementById(
            "content"
        );


    let html = `

        <section class="section">

            <div class="section-title">

                <h2>
                    Rotina de hoje
                </h2>

                <span>
                    ${dataHoje}
                </span>

            </div>

    `;


    /* DIÁRIAS */

    html += `

        <div class="group">

            <div class="group-title">
                ☀️ Rotina diária
            </div>

            <div class="tasks-grid">

    `;


    zeladoriaDiaria.forEach(
        item => {

            html +=
                criarCard(
                    item.nome,
                    item.icone,
                    item.detalhe,
                    estaConcluida(
                        item.nome
                    )
                );

        }
    );


    html += `

            </div>

        </div>

    `;


    /* SEMANAL */

    const semanal =
        zeladoriaSemanal[
            diaSemana
        ];


    html += `

        <div class="group">

            <div class="group-title">
                📅 Atividade semanal
            </div>

    `;


    if (semanal) {

        html +=
            criarCard(
                semanal.nome,
                semanal.icone,
                semanal.detalhe,
                estaConcluida(
                    semanal.nome
                )
            );

    } else {

        html += `

            <div class="empty">
                Nenhuma atividade semanal
                programada para hoje.
            </div>

        `;

    }


    html += `
        </div>
    `;


    /* RESERVAS */

    const reservas =
        obterReservasHoje();


    html += `

        <div class="group">

            <div class="group-title">
                🛖 Quiosques / reservas
            </div>

    `;


    if (
        reservas.length === 0
    ) {

        html += `

            <div class="event-card">

                <strong>
                    Nenhuma limpeza por reserva
                </strong>

                Não há quiosques programados
                para limpeza hoje.

            </div>

        `;

    } else {

        reservas.forEach(
            reserva => {

                html +=
                    criarCard(
                        reserva.local,
                        "🛖",
                        "Limpeza após utilização",
                        estaConcluida(
                            reserva.local
                        )
                    );

            }
        );

    }


    html += `
        </div>
    `;


    /* RONDA */

    html += `

        <div class="group">

            <div class="group-title">
                🔎 Ronda de conservação
            </div>

            <div class="tasks-grid">

    `;


    rondas.forEach(
        item => {

            html +=
                criarCard(
                    item.nome,
                    item.icone,
                    item.detalhe,
                    estaConcluida(
                        item.nome
                    )
                );

        }
    );


    html += `

            </div>

        </div>

        </section>

    `;


    content.innerHTML =
        html;


    atualizarContadoresZeladoria();

}


/* ==================================================
   CARD GENÉRICO
================================================== */

function criarCard(
    nome,
    icone,
    detalhe,
    concluida
) {

    const status =
        concluida
        ? `
            <span
                class="status done"
            >
                ✓ CONCLUÍDO
            </span>
          `
        : `
            <span
                class="status pending"
            >
                PENDENTE
            </span>
          `;


    return `

        <button
            class="task"
            onclick="
                abrirAtividade(
                    '${escaparJS(nome)}'
                )
            "
        >

            <div class="task-icon">
                ${icone}
            </div>


            <div class="task-main">

                <strong>
                    ${nome}
                </strong>

                <span>
                    ${detalhe}
                </span>

            </div>


            ${status}

        </button>

    `;

}


/* ==================================================
   ABRIR TORRE
================================================== */

function abrirTorre(
    torre
) {

    localStorage.setItem(
        "torreSelecionada",
        torre
    );


    /*
       Por enquanto a Torre E
       já possui sua estrutura.

       Quando cadastrarmos A-D,
       usamos a mesma lógica.
    */

    localStorage.setItem(
        "localSelecionado",
        "Térreo / Hall de entrada"
    );


    window.location.href =
        "atividade.html";

}


/* ==================================================
   ABRIR ATIVIDADE
================================================== */

function abrirAtividade(
    local
) {

    localStorage.setItem(
        "localSelecionado",
        local
    );


    localStorage.setItem(
        "torreSelecionada",
        "Reserva Igara"
    );


    localStorage.setItem(
        "tipoAtividadeAtual",
        usuario.tipo
    );


    window.location.href =
        "atividade.html";

}


/* ==================================================
   CONTADORES LIMPEZA
================================================== */

function atualizarContadoresLimpeza() {

    let total = 0;
    let concluidas = 0;


    usuario.atribuicoes.forEach(
        item => {

            if (
                item.tipo ===
                "torre"
            ) {

                const quantidade =
                    estruturaTorres[
                        item.nome
                    ] || 17;


                total +=
                    quantidade;


                concluidas +=
                    obterConcluidas()
                    .filter(
                        atividade =>
                            typeof atividade ===
                                "object"
                            &&
                            atividade.torre ===
                                item.nome
                            &&
                            (
                                !atividade.data
                                ||
                                atividade.data ===
                                    dataHoje
                            )
                    )
                    .length;

            }


            if (
                item.tipo ===
                "espaco"
            ) {

                total++;


                if (
                    estaConcluida(
                        item.nome
                    )
                ) {

                    concluidas++;

                }

            }

        }
    );


    atualizarResumo(
        total,
        concluidas
    );

}


/* ==================================================
   CONTADORES ZELADOR
================================================== */

function atualizarContadoresZeladoria() {

    let tarefas = [
        ...zeladoriaDiaria,
        ...rondas
    ];


    const semanal =
        zeladoriaSemanal[
            diaSemana
        ];


    if (semanal) {

        tarefas.push(
            semanal
        );

    }


    const reservas =
        obterReservasHoje();


    reservas.forEach(
        reserva => {

            tarefas.push({

                nome:
                    reserva.local

            });

        }
    );


    const total =
        tarefas.length;


    const concluidas =
        tarefas.filter(
            item =>
                estaConcluida(
                    item.nome
                )
        ).length;


    atualizarResumo(
        total,
        concluidas
    );

}


/* ==================================================
   RESUMO
================================================== */

function atualizarResumo(
    total,
    concluidas
) {

    document
        .getElementById(
            "totalCount"
        )
        .textContent =
            total;


    document
        .getElementById(
            "completedCount"
        )
        .textContent =
            concluidas;


    document
        .getElementById(
            "pendingCount"
        )
        .textContent =
            Math.max(
                total -
                concluidas,
                0
            );

}


/* ==================================================
   ESCAPE
================================================== */

function escaparJS(
    texto
) {

    return String(texto)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* ==================================================
   LOGOUT
================================================== */

function sair() {

    localStorage.removeItem(
        "usuarioLogado"
    );


    window.location.href =
        "index.html";

}


/* ==================================================
   INICIAR
================================================== */

if (
    usuario.tipo ===
    "zeladoria"
) {

    renderZeladoria();

} else {

    renderLimpeza();

}

</script>
