<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documentos — Gestão ORAQUI</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8;color:#2d3742;margin:0}header{background:linear-gradient(120deg,#6d80a8,#7c72ae);color:white;padding:24px 18px}main{max-width:760px;margin:auto;padding:18px}h1{font-size:24px}.card{background:white;border-radius:18px;padding:17px;margin:13px 0;box-shadow:0 7px 24px #25313c0c}.muted{color:#73808d;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{background:#7667b9;color:white;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}.btn.secondary{background:#eae7f6;color:#55478e}.btn:disabled{opacity:.5}input,select{width:100%;padding:12px;box-sizing:border-box;border:1px solid #dce2e9;border-radius:11px;margin:6px 0 12px}label{font-size:12px;font-weight:700}.error{color:#ad2533}.ok{color:#2b8153}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:12px}small{color:#73808d}#status{margin:12px 0}</style></head><body><header><div class="row"><h1>📁 Documentos — Gestão</h1><a class="btn secondary" href="gestor.html">← VOLTAR</a></div></header><main><div id="status"></div><div class="card"><label>CONDOMÍNIO</label><select id="condo"></select><label>COLABORADOR</label><select id="colab"></select><label>TIPO DE DOCUMENTO</label><select id="tipo"><option>Holerite</option><option>Recibo de férias</option><option>Informe de rendimentos</option><option>Comprovante de pagamento</option><option>Comunicado</option><option>Outro</option></select><label>COMPETÊNCIA (AAAA-MM)</label><input type="month" id="competencia"><label>PDF</label><input type="file" id="arquivo" accept="application/pdf"><label style="display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 0"><input id="exigirCiencia" type="checkbox" style="width:auto;margin:0;transform:scale(1.3)"> Exigir confirmação de recebimento e ciência</label><button id="enviar" class="btn">ENVIAR DOCUMENTO</button></div><h2>Documentos publicados</h2><div id="lista"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://rhiosvsohvqqrxzwohqu.supabase.co','sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt');
const BUCKET='documentos-privados';const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function aviso(s,erro=false){$('status').textContent=s;$('status').className=erro?'error':'ok'}
async function urlTemporaria(path){const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,90);if(error)throw error;return data.signedUrl}
async function abrirDocumento(path){try{const url=await urlTemporaria(path);window.open(url,'_blank','noopener,noreferrer')}catch(e){aviso('Não foi possível abrir: '+e.message,true)}}
async function compartilharDocumento(path,nome){try{const url=await urlTemporaria(path);const resp=await fetch(url);if(!resp.ok)throw Error('Falha ao obter PDF');const blob=await resp.blob();const arquivo=new File([blob],nome||'documento.pdf',{type:'application/pdf'});if(navigator.canShare?.({files:[arquivo]})){await navigator.share({files:[arquivo],title:'Documento ORAQUI'});return}if(navigator.share){await navigator.share({url,title:'Documento ORAQUI'});aviso('Link temporário compartilhado; expira em 90 segundos.');return}await navigator.clipboard.writeText(url);aviso('Link temporário copiado (90 segundos).')}catch(e){if(e.name!=='AbortError')aviso('Compartilhamento indisponível: '+e.message,true)}}
</script><script>

function abrirComprovanteImpressao(doc,colab){
 const campo=(titulo,valor)=>`<section><b>${esc(titulo)}</b><div>${esc(valor??'Não informado')}</div></section>`;
 const data=new Date(doc.ciencia_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
 const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>ORAQUI - Comprovante de ciência</title><style>body{font:15px Arial,sans-serif;color:#26303c;margin:30px auto;max-width:750px;padding:0 22px}h1{background:#6c68ae;color:white;padding:23px;font-size:22px}section{padding:11px 4px;border-bottom:1px solid #dce0e8;overflow-wrap:anywhere}section b{display:block;margin-bottom:6px;font-size:12px;text-transform:uppercase}p{font-size:12px;color:#536070;line-height:1.5;margin-top:30px}@media print{body{margin:0;max-width:none}h1{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><h1>ORAQUI — Comprovante de ciência</h1>${campo('Colaborador',colab?.nome||'Identificação pelo registro do documento')}${campo('Matrícula',colab?.matricula||'-')}${campo('Condomínio (ID)',String(doc.condominio_id||condoAtual))}${campo('Documento',doc.tipo+' — '+(doc.competencia||'Sem competência'))}${campo('Nome do arquivo',doc.nome_arquivo)}${campo('Identificador do documento',doc.id)}${campo('Data/hora da confirmação',data+' (horário de Brasília)')}${campo('Conta autenticada que confirmou (UUID)',doc.ciencia_por)}<p>Este comprovante documenta a manifestação eletrônica de recebimento e ciência registrada no ORAQUI. Não é assinatura digital ICP-Brasil ou GOV.BR e não comprova, por si só, o pagamento de salário.</p></body></html>`;
 let modal=document.getElementById('oraqui-comprovante-modal');
 if(modal)modal.remove();
 modal=document.createElement('div');modal.id='oraqui-comprovante-modal';
 modal.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(18,24,37,.7);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px';
 const barra=document.createElement('div');barra.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:white;border-radius:12px;padding:10px;width:min(100%,780px);box-sizing:border-box';
 const salvar=document.createElement('button');salvar.type='button';salvar.className='btn';salvar.textContent='🖨️ SALVAR COMO PDF / IMPRIMIR';
 const fechar=document.createElement('button');fechar.type='button';fechar.className='btn secondary';fechar.textContent='FECHAR';
 const frame=document.createElement('iframe');frame.title='Comprovante de ciência';frame.style.cssText='width:min(100%,780px);height:75vh;background:white;border:0;border-radius:12px';
 barra.append(salvar,fechar);modal.append(barra,frame);document.body.append(modal);
 frame.srcdoc=html;
 fechar.onclick=()=>modal.remove();
 salvar.onclick=()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}catch(e){aviso('Não foi possível imprimir: '+e.message,true)}};
 aviso('Comprovante exibido. Clique em SALVAR COMO PDF / IMPRIMIR e escolha “Salvar como PDF”.');
}
function gerarComprovante(doc,colab){
 try{if(!doc.ciencia_em)throw Error('Ainda não existe ciência registrada.');abrirComprovanteImpressao(doc,colab)}
 catch(e){aviso('Falha ao gerar comprovante: '+e.message,true)}
}

let condoAtual=null,usuarios=[];
async function iniciar(){try{const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user)throw Error('Faça login como gestor.');const {data,error}=await db.from('usuarios_gestao').select('condominio_id').eq('auth_user_id',user.id).eq('ativo',true);if(error)throw error;const ids=[...new Set((data||[]).map(x=>x.condominio_id))];if(!ids.length)throw Error('Sem acesso à gestão de condomínios.');const {data:cs,error:ce}=await db.from('condominios').select('id,nome').in('id',ids).order('nome');if(ce)throw ce;$('condo').innerHTML=(cs||[]).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');const preferido=sessionStorage.getItem('oraqui_gestao_condominio_id');if(ids.map(String).includes(preferido))$('condo').value=preferido;$('condo').onchange=carregar;await carregar();}catch(e){aviso(e.message,true)}}
async function carregar(){condoAtual=Number($('condo').value);const alvo=condoAtual;const [c,d]=await Promise.all([db.from('colaboradores').select('id,nome,matricula').eq('condominio_id',alvo).order('nome'),db.from('documentos_colaborador').select('id,colaborador_id,tipo,competencia,nome_arquivo,storage_path,created_at,exigir_ciencia,ciencia_em,ciencia_por').eq('condominio_id',alvo).order('created_at',{ascending:false}).limit(100)]);if(alvo!==Number($('condo').value))return;if(c.error||d.error){aviso((c.error||d.error).message,true);return}usuarios=c.data||[];$('colab').innerHTML=usuarios.map(x=>`<option value="${x.id}">${esc(x.nome)} • ${esc(x.matricula||'')}</option>`).join('');const docs=d.data||[];$('lista').innerHTML=docs.length?docs.map(x=>`<div class="card"><strong>${esc(x.tipo)} — ${esc(x.competencia||'')}</strong><div class="muted">${esc(usuarios.find(u=>u.id===x.colaborador_id)?.nome||'Colaborador')} · ${esc(x.nome_arquivo)}</div><div class="muted" style="margin-top:8px">${!x.exigir_ciencia?'Ciência não exigida':x.ciencia_em?'✅ Ciência confirmada em '+esc(new Date(x.ciencia_em).toLocaleString('pt-BR')):'⏳ Aguardando ciência'}</div><button class="btn secondary" data-id="${x.id}" style="margin-top:10px">VISUALIZAR</button>${x.ciencia_em?` <button class="btn" data-comprovante="${x.id}" style="margin-top:10px">📄 COMPROVANTE PDF</button>`:''}</div>`).join(''):'<div class="card">Nenhum documento publicado.</div>';$('lista').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id||b.dataset.comprovante;const x=docs.find(x=>String(x.id)===id);if(!x)return;if(b.dataset.comprovante)gerarComprovante(x,usuarios.find(u=>u.id===x.colaborador_id));else abrirDocumento(x.storage_path)};}
$('enviar').onclick=async()=>{const btn=$('enviar');btn.disabled=true;try{const file=$('arquivo').files[0];if(!file||file.type!=='application/pdf'||file.size>10*1024*1024)throw Error('Selecione um PDF de até 10 MB.');const colaboradorId=Number($('colab').value);if(!colaboradorId)throw Error('Selecione o colaborador.');const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Sessão expirada.');const id=crypto.randomUUID();const path=`${condoAtual}/${colaboradorId}/${id}.pdf`;const {error:up}=await db.storage.from(BUCKET).upload(path,file,{contentType:'application/pdf',upsert:false});if(up)throw up;const {error:ins}=await db.from('documentos_colaborador').insert({id,condominio_id:condoAtual,colaborador_id:colaboradorId,tipo:$('tipo').value,competencia:$('competencia').value||null,nome_arquivo:file.name,storage_path:path,criado_por:user.id,exigir_ciencia:$('exigirCiencia').checked});if(ins){await db.storage.from(BUCKET).remove([path]);throw ins}aviso('Documento disponibilizado para o colaborador.');$('arquivo').value='';$('exigirCiencia').checked=false;await carregar();}catch(e){aviso('Falha no envio: '+e.message,true)}finally{btn.disabled=false}};iniciar();
</script></body></html>
