<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ORAQUI</title>

    <meta
        name="description"
        content="ORAQUI — Agora. Aqui. Registrado."
    >

    <meta
        name="theme-color"
        content="#edf8ff"
    >

    <style>

        :root {
            --blue:#2367a8;
            --blue-light:#4c91d0;
            --text:#173f70;
            --muted:#7892ad;
        }

        * {
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html,
        body {
            width:100%;
            min-height:100%;
        }

        body {

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            overflow:hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    145deg,
                    #fffdf8 0%,
                    #f4fbff 35%,
                    #e6f6ff 100%
                );

        }


        /* =====================================
           FORMAS DE FUNDO
        ===================================== */

        .shape {

            position:fixed;

            border-radius:50%;

            pointer-events:none;

        }

        .shape-one {

            width:600px;
            height:600px;

            left:-350px;
            top:-380px;

            background:
                rgba(255,235,197,.48);

        }

        .shape-two {

            width:520px;
            height:520px;

            right:-310px;
            bottom:-330px;

            background:
                rgba(177,222,249,.42);

        }

        .shape-three {

            width:230px;
            height:230px;

            right:9%;
            top:10%;

            background:
                rgba(190,225,184,.25);

        }

        .shape-four {

            width:170px;
            height:170px;

            left:12%;
            bottom:8%;

            background:
                rgba(232,215,250,.24);

        }


        /* =====================================
           MARCA
        ===================================== */

        main {

            position:relative;
            z-index:2;

            display:flex;
            flex-direction:column;

            align-items:center;

            padding:30px;

            text-align:center;

        }

        .logo {

            width:82px;
            height:82px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:25px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-light)
                );

            color:white;

            font-size:41px;
            font-weight:900;

            box-shadow:
                0 18px 40px
                rgba(35,103,168,.18);

        }

        h1 {

            margin-top:24px;

            color:var(--text);

            font-size:50px;
            font-weight:900;

            letter-spacing:2px;

        }

        .tagline {

            margin-top:7px;

            color:var(--muted);

            font-size:10px;
            font-weight:800;

            letter-spacing:2.3px;

            text-transform:uppercase;

        }


        /* =====================================
           DETALHE
        ===================================== */

        .detail {

            width:38px;
            height:4px;

            margin-top:25px;

            border-radius:10px;

            background:
                linear-gradient(
                    90deg,
                    #78bde8,
                    #94c98c
                );

            opacity:.75;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media(max-width:600px) {

            .logo {

                width:70px;
                height:70px;

                border-radius:22px;

                font-size:35px;

            }

            h1 {

                margin-top:20px;

                font-size:40px;

            }

            .tagline {

                font-size:8px;

                letter-spacing:1.8px;

            }

            .shape-one {

                width:430px;
                height:430px;

                left:-280px;
                top:-270px;

            }

            .shape-two {

                width:400px;
                height:400px;

                right:-270px;
                bottom:-250px;

            }

        }


        /* =====================================
           ACESSO
        ===================================== */

        .login-card {
            width:min(390px, calc(100vw - 34px));
            margin-top:28px;
            padding:20px;
            border:1px solid rgba(35,103,168,.10);
            border-radius:22px;
            background:rgba(255,255,255,.82);
            box-shadow:0 18px 50px rgba(35,103,168,.10);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
        }

        .login-title {
            color:var(--text);
            font-size:14px;
            font-weight:900;
        }

        .login-subtitle {
            margin-top:5px;
            color:var(--muted);
            font-size:9px;
            line-height:1.5;
        }

        .field {
            margin-top:13px;
            text-align:left;
        }

        .field label {
            display:block;
            margin-bottom:6px;
            color:var(--muted);
            font-size:8px;
            font-weight:900;
            letter-spacing:.5px;
            text-transform:uppercase;
        }

        .field input {
            width:100%;
            height:48px;
            padding:0 14px;
            border:1px solid #dbe7f0;
            border-radius:14px;
            outline:none;
            background:#fff;
            color:#29445f;
            font-size:14px;
        }

        .field input:focus {
            border-color:#7db5df;
            box-shadow:0 0 0 3px rgba(76,145,208,.10);
        }

        .login-button {
            width:100%;
            height:50px;
            margin-top:16px;
            border:0;
            border-radius:14px;
            background:linear-gradient(135deg,var(--blue),var(--blue-light));
            color:#fff;
            font-size:10px;
            font-weight:900;
            letter-spacing:.5px;
        }

        .login-button:disabled {
            opacity:.55;
            cursor:default;
        }

        .login-message {
            display:none;
            margin-top:12px;
            padding:10px 12px;
            border-radius:12px;
            background:#fff1f1;
            color:#a84d4d;
            font-size:9px;
            font-weight:700;
            line-height:1.5;
        }

        .login-message.visible { display:block; }

        .access-status {
            display:none;
            margin-top:15px;
            color:var(--muted);
            font-size:9px;
            font-weight:700;
        }

        .access-status.visible { display:block; }

        .forgot {
            display:inline-block;
            margin-top:13px;
            border:0;
            background:transparent;
            color:var(--blue);
            font-size:9px;
            font-weight:800;
        }

        @media(max-height:720px) {
            body { overflow:auto; }
            main { padding-top:35px; padding-bottom:35px; }
            .logo { width:62px; height:62px; font-size:31px; }
            h1 { margin-top:15px; font-size:36px; }
            .detail { margin-top:16px; }
            .login-card { margin-top:18px; }
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>
    <div class="shape shape-four"></div>


    <main>

        <div class="logo">✓</div>

        <h1>ORAQUI</h1>

        <div class="tagline">Agora. Aqui. Registrado.</div>

        <div class="detail"></div>

        <section class="login-card" id="loginCard">
            <div class="login-title">Acesso ao ORAQUI</div>
            <div class="login-subtitle">Entre com o e-mail e a senha vinculados ao seu acesso.</div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" autocomplete="username" inputmode="email" required>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="login-button" id="loginButton" type="submit">ENTRAR</button>
            </form>

            <button class="forgot" id="forgotButton" type="button">ESQUECI MINHA SENHA</button>

            <div class="login-message" id="loginMessage"></div>
            <div class="access-status" id="accessStatus">Verificando seus acessos...</div>
        </section>

    </main>



<script>
const SUPABASE_URL = "https://rhiosvsohvqqrxzwohqu.supabase.co";
const SUPABASE_KEY = "sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function mensagem(texto){
    const el = $("loginMessage");
    el.textContent = texto || "";
    el.classList.toggle("visible", !!texto);
}

function carregando(ativo, texto="Verificando seus acessos..."){
    $("loginButton").disabled = ativo;
    $("email").disabled = ativo;
    $("password").disabled = ativo;
    $("accessStatus").textContent = texto;
    $("accessStatus").classList.toggle("visible", ativo);
}

function traduzErroLogin(msg){
    const m = String(msg || "").toLowerCase();
    if(m.includes("invalid login credentials")) return "E-mail ou senha incorretos.";
    if(m.includes("email not confirmed")) return "Este e-mail ainda não foi confirmado.";
    if(m.includes("too many requests")) return "Muitas tentativas. Aguarde alguns minutos e tente novamente.";
    return msg || "Não foi possível entrar.";
}

async function detectarAcessos(user){
    /*
      A rota não concede permissão. Ela apenas escolhe a interface.
      O acesso real continua protegido pelo Supabase/RLS.
    */
    const [adminResult, gestaoResult, colaboradorResult] = await Promise.all([
        db.from("oraqui_admins")
          .select("auth_user_id")
          .eq("auth_user_id", user.id)
          .eq("ativo", true)
          .maybeSingle(),

        db.from("usuarios_gestao")
          .select("id,condominio_id,perfil,ativo")
          .eq("auth_user_id", user.id)
          .eq("ativo", true)
          .limit(1),

        db.from("colaboradores")
          .select("id,condominio_id,funcao,ativo")
          .eq("auth_user_id", user.id)
          .eq("ativo", true)
          .limit(1)
    ]);

    // Se uma tabela não for visível por RLS, não derrubamos o login inteiro.
    const admin = !adminResult.error && !!adminResult.data;
    const gestao = !gestaoResult.error && (gestaoResult.data || []).length > 0;
    const colaborador = !colaboradorResult.error && (colaboradorResult.data || []).length > 0;

    return {admin, gestao, colaborador};
}

async function encaminharUsuario(user){
    carregando(true, "Identificando seu perfil...");

    const acessos = await detectarAcessos(user);

    /*
      Prioridade operacional:
      - colaborador: abre a operação do colaborador;
      - gestão: abre a gestão;
      - somente admin global: abre administração.
      Se uma mesma conta tiver colaborador + gestão, priorizamos gestão,
      pois ela possui o escopo operacional mais amplo.
    */
    if(acessos.gestao){
        location.replace("./gestor.html");
        return;
    }

    if(acessos.colaborador){
        location.replace("./colaborador.html");
        return;
    }

    if(acessos.admin){
        location.replace("./admin.html");
        return;
    }

    await db.auth.signOut();
    carregando(false);
    mensagem("Sua conta foi autenticada, mas não possui um acesso ativo no ORAQUI.");
}

$("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    mensagem("");

    const email = $("email").value.trim();
    const password = $("password").value;

    if(!email || !password){
        mensagem("Informe e-mail e senha.");
        return;
    }

    carregando(true, "Entrando...");

    try{
        const {data, error} = await db.auth.signInWithPassword({email, password});
        if(error) throw error;
        if(!data?.user) throw new Error("Não foi possível identificar o usuário autenticado.");

        await encaminharUsuario(data.user);
    }catch(error){
        console.error(error);
        carregando(false);
        mensagem(traduzErroLogin(error.message));
    }
});

$("forgotButton").addEventListener("click", async () => {
    mensagem("");

    const email = $("email").value.trim();

    if(!email){
        mensagem("Informe seu e-mail acima para recuperar a senha.");
        $("email").focus();
        return;
    }

    $("forgotButton").disabled = true;

    try{
        const {error} = await db.auth.resetPasswordForEmail(email, {
            redirectTo: `${location.origin}/definir-senha.html`
        });
        if(error) throw error;

        const el = $("loginMessage");
        el.style.background = "#edf8f0";
        el.style.color = "#477a59";
        mensagem("Enviamos as instruções de recuperação para o e-mail informado.");
    }catch(error){
        console.error(error);
        mensagem(error.message || "Não foi possível enviar a recuperação de senha.");
    }finally{
        $("forgotButton").disabled = false;
    }
});

async function iniciar(){
    try{
        const {data:{session}, error} = await db.auth.getSession();
        if(error) throw error;

        if(session?.user){
            await encaminharUsuario(session.user);
        }
    }catch(error){
        console.error(error);
        carregando(false);
        mensagem("Não foi possível verificar a sessão. Recarregue a página.");
    }
}

iniciar();
</script>

</body>

</html>
