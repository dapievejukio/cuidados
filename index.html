<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ORAQUI</title>

    <meta
        name="description"
        content="ORAQUI — Agora. Aqui. Registrado."
    >

    <meta
        name="theme-color"
        content="#f4f6f8"
    >

    <style>

        :root{
            --purple:#5b43c4;
            --purple-2:#7258d8;
            --navy:#142b3d;
            --text:#172d3d;
            --muted:#718596;
            --line:#dfe6ec;
            --bg:#f4f6f8;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{width:100%;min-height:100%}
        body{
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            background:
              radial-gradient(circle at 16% 18%,rgba(91,67,196,.10),transparent 27%),
              radial-gradient(circle at 84% 82%,rgba(72,122,160,.11),transparent 29%),
              linear-gradient(145deg,#f9fafb 0%,#f3f5f7 48%,#eef2f5 100%);
            color:var(--text);overflow:auto;
        }
        .shape{position:fixed;border-radius:50%;pointer-events:none;filter:blur(1px)}
        .shape-one{width:520px;height:520px;left:-340px;top:-340px;background:rgba(91,67,196,.055)}
        .shape-two{width:480px;height:480px;right:-310px;bottom:-320px;background:rgba(51,103,143,.055)}
        .shape-three,.shape-four{display:none}
        main{
            position:relative;z-index:2;width:100%;display:flex;flex-direction:column;
            align-items:center;padding:38px 20px 34px;text-align:center;
        }
        .brand-lockup{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:25px}
        .logo{
            width:68px;height:68px;display:flex;align-items:center;justify-content:center;
            border-radius:21px;background:linear-gradient(145deg,var(--purple),var(--purple-2));
            box-shadow:0 14px 30px rgba(91,67,196,.20);overflow:hidden;flex:0 0 68px;
        }
        .logo img{width:100%;height:100%;object-fit:cover;display:block}
        .brand-copy{text-align:left}
        h1{color:var(--navy);font-size:35px;font-weight:950;letter-spacing:.7px;line-height:1}
        .tagline{
            margin-top:7px;color:#758390;font-size:9px;font-weight:700;
            letter-spacing:1.55px;text-transform:uppercase;white-space:nowrap
        }
        .detail{display:none}
        .login-card{
            width:min(410px,calc(100vw - 34px));margin-top:0;padding:27px 25px 22px;
            border:1px solid rgba(21,45,61,.08);border-radius:25px;background:rgba(255,255,255,.94);
            box-shadow:0 20px 55px rgba(27,52,70,.10);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        }
        .login-title{color:var(--navy);font-size:16px;font-weight:900}
        .login-subtitle{margin-top:6px;color:var(--muted);font-size:9px;line-height:1.55}
        .field{margin-top:16px;text-align:left}
        .field label{display:block;margin:0 0 7px 2px;color:#718394;font-size:8px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}
        .field input{
            width:100%;height:51px;padding:0 15px;border:1px solid var(--line);border-radius:15px;
            outline:none;background:#fff;color:#20394a;font-size:14px;transition:.18s ease;
        }
        .field input:focus{border-color:#9b8ce3;box-shadow:0 0 0 4px rgba(91,67,196,.08)}
        .login-button{
            width:100%;height:52px;margin-top:18px;border:0;border-radius:15px;
            background:linear-gradient(135deg,var(--purple),#7054d4);color:#fff;font-size:10px;
            font-weight:900;letter-spacing:.7px;box-shadow:0 10px 22px rgba(91,67,196,.18);cursor:pointer;
        }
        .login-button:disabled{opacity:.55;cursor:default}
        .login-message{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff1f1;color:#a84d4d;font-size:9px;font-weight:700;line-height:1.5}
        .login-message.visible{display:block}
        .access-status{display:none;margin-top:15px;color:var(--muted);font-size:9px;font-weight:700}
        .access-status.visible{display:block}
        .forgot{display:inline-block;margin-top:15px;border:0;background:transparent;color:var(--purple);font-size:8px;font-weight:900;letter-spacing:.25px;cursor:pointer}
        .login-footer{margin-top:17px;color:#9aa6af;font-size:7px;font-weight:700;letter-spacing:.45px}
        @media(max-width:600px){
            main{padding:28px 17px}
            .brand-lockup{gap:12px;margin-bottom:22px}
            .logo{width:60px;height:60px;flex-basis:60px;border-radius:18px}
            h1{font-size:31px}.tagline{font-size:7.5px;letter-spacing:1.15px}
            .login-card{padding:24px 20px 20px}
        }
        @media(max-height:720px){
            main{padding-top:24px;padding-bottom:24px}.brand-lockup{margin-bottom:17px}
            .logo{width:56px;height:56px;flex-basis:56px}.login-card{padding-top:22px}
        }

    
        .brand-lockup{
            width:min(330px,76vw);
            margin:0 0 25px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .official-logo{
            display:block;
            width:100%;
            height:auto;
            object-fit:contain;
        }
        @media(max-width:600px){
            .brand-lockup{width:min(300px,78vw);margin-bottom:22px}
        }
        @media(max-height:720px){
            .brand-lockup{width:min(270px,72vw);margin-bottom:17px}
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>
    <div class="shape shape-four"></div>


    <main>

        <div class="brand-lockup">
            <img class="official-logo" src="/oraqui-brand/logo-horizontal-transparente.png" alt="ORAQUI — Agora. Aqui. Registrado.">
        </div>

        <section class="login-card" id="loginCard">
            <div class="login-title">Acesso ao ORAQUI</div>
            <div class="login-subtitle">Entre com o e-mail e a senha vinculados ao seu acesso.</div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" autocomplete="username" inputmode="email" required>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="login-button" id="loginButton" type="submit">ENTRAR</button>
            </form>

            <button class="forgot" id="forgotButton" type="button">ESQUECI MINHA SENHA</button>

            <div class="login-message" id="loginMessage"></div>
            <div class="access-status" id="accessStatus">Verificando seus acessos...</div>
            <div class="login-footer">ACESSO SEGURO • ORAQUI.APP</div>
        </section>

    </main>



<script>
const SUPABASE_URL = "https://rhiosvsohvqqrxzwohqu.supabase.co";
const SUPABASE_KEY = "sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function mensagem(texto){
    const el = $("loginMessage");
    el.textContent = texto || "";
    el.classList.toggle("visible", !!texto);
}

function carregando(ativo, texto="Verificando seus acessos..."){
    $("loginButton").disabled = ativo;
    $("email").disabled = ativo;
    $("password").disabled = ativo;
    $("accessStatus").textContent = texto;
    $("accessStatus").classList.toggle("visible", ativo);
}

function traduzErroLogin(msg){
    const m = String(msg || "").toLowerCase();
    if(m.includes("invalid login credentials")) return "E-mail ou senha incorretos.";
    if(m.includes("email not confirmed")) return "Este e-mail ainda não foi confirmado.";
    if(m.includes("too many requests")) return "Muitas tentativas. Aguarde alguns minutos e tente novamente.";
    return msg || "Não foi possível entrar.";
}

async function detectarAcessos(user){
    /*
      A rota não concede permissão. Ela apenas escolhe a interface.
      O acesso real continua protegido pelo Supabase/RLS.
    */
    const [adminResult, gestaoResult, colaboradorResult] = await Promise.all([
        db.from("oraqui_admins")
          .select("auth_user_id")
          .eq("auth_user_id", user.id)
          .eq("ativo", true)
          .limit(1),

        db.from("usuarios_gestao")
          .select("id,condominio_id,perfil,ativo")
          .eq("auth_user_id", user.id)
          .eq("ativo", true)
          .limit(1),

        db.from("colaboradores")
          .select("id,condominio_id,funcao,ativo")
          .eq("auth_user_id", user.id)
          .eq("ativo", true)
          .limit(1)
    ]);

    // Se uma tabela não for visível por RLS, não derrubamos o login inteiro.
    const admin = !adminResult.error && (adminResult.data || []).length > 0;
    const gestao = !gestaoResult.error && (gestaoResult.data || []).length > 0;
    const colaborador = !colaboradorResult.error && (colaboradorResult.data || []).length > 0;

    return {admin, gestao, colaborador};
}

async function encaminharUsuario(user){
    carregando(true, "Identificando seu perfil...");

    const acessos = await detectarAcessos(user);

    /*
      Prioridade operacional:
      - colaborador: abre a operação do colaborador;
      - gestão: abre a gestão;
      - somente admin global: abre administração.
      Se uma mesma conta tiver colaborador + gestão, priorizamos gestão,
      pois ela possui o escopo operacional mais amplo.
    */
    if(acessos.gestao){
        location.replace("./gestor.html");
        return;
    }

    if(acessos.colaborador){
        location.replace("./colaborador.html");
        return;
    }

    if(acessos.admin){
        location.replace("./admin.html");
        return;
    }

    await db.auth.signOut();
    carregando(false);
    mensagem("Sua conta foi autenticada, mas não possui um acesso ativo no ORAQUI.");
}

$("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    mensagem("");

    const email = $("email").value.trim();
    const password = $("password").value;

    if(!email || !password){
        mensagem("Informe e-mail e senha.");
        return;
    }

    carregando(true, "Entrando...");

    try{
        const {data, error} = await db.auth.signInWithPassword({email, password});
        if(error) throw error;
        if(!data?.user) throw new Error("Não foi possível identificar o usuário autenticado.");

        await encaminharUsuario(data.user);
    }catch(error){
        console.error(error);
        carregando(false);
        mensagem(traduzErroLogin(error.message));
    }
});

$("forgotButton").addEventListener("click", async () => {
    mensagem("");

    const email = $("email").value.trim();

    if(!email){
        mensagem("Informe seu e-mail acima para recuperar a senha.");
        $("email").focus();
        return;
    }

    $("forgotButton").disabled = true;

    try{
        const {error} = await db.auth.resetPasswordForEmail(email, {
            redirectTo: `${location.origin}/definir-senha.html`
        });
        if(error) throw error;

        const el = $("loginMessage");
        el.style.background = "#edf8f0";
        el.style.color = "#477a59";
        mensagem("Enviamos as instruções de recuperação para o e-mail informado.");
    }catch(error){
        console.error(error);
        mensagem(error.message || "Não foi possível enviar a recuperação de senha.");
    }finally{
        $("forgotButton").disabled = false;
    }
});

async function iniciar(){
    try{
        const {data:{session}, error} = await db.auth.getSession();
        if(error) throw error;

        if(session?.user){
            await encaminharUsuario(session.user);
        }
    }catch(error){
        console.error(error);
        carregando(false);
        mensagem("Não foi possível verificar a sessão. Recarregue a página.");
    }
}

iniciar();
</script>

</body>

</html>
