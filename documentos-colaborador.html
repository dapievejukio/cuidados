<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus documentos — ORAQUI</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8;color:#2d3742;margin:0}header{background:linear-gradient(120deg,#6d80a8,#7c72ae);color:white;padding:24px 18px}main{max-width:760px;margin:auto;padding:18px}h1{font-size:24px}.card{background:white;border-radius:18px;padding:17px;margin:13px 0;box-shadow:0 7px 24px #25313c0c}.muted{color:#73808d;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{background:#7667b9;color:white;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}.btn.secondary{background:#eae7f6;color:#55478e}.btn:disabled{opacity:.5}input,select{width:100%;padding:12px;box-sizing:border-box;border:1px solid #dce2e9;border-radius:11px;margin:6px 0 12px}label{font-size:12px;font-weight:700}.error{color:#ad2533}.ok{color:#2b8153}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:12px}small{color:#73808d}#status{margin:12px 0}</style></head><body><header><div class="row"><h1>📁 Meus documentos</h1><a class="btn secondary" href="colaborador.html">← VOLTAR</a></div></header><main><div class="muted">Arquivos disponibilizados para sua conta. Você pode abrir, baixar ou compartilhar pelo WhatsApp e outros aplicativos.</div><div id="status"></div><div id="lista">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://rhiosvsohvqqrxzwohqu.supabase.co','sb_publishable_vcjiMMCTxQJ7ArTGsQ-PuQ_5gaAfoIt');
const BUCKET='documentos-privados';const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function aviso(s,erro=false){$('status').textContent=s;$('status').className=erro?'error':'ok'}
async function urlTemporaria(path){const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,90);if(error)throw error;return data.signedUrl}
async function abrirDocumento(path){try{const url=await urlTemporaria(path);window.open(url,'_blank','noopener,noreferrer')}catch(e){aviso('Não foi possível abrir: '+e.message,true)}}
async function compartilharDocumento(path,nome){try{const url=await urlTemporaria(path);const resp=await fetch(url);if(!resp.ok)throw Error('Falha ao obter PDF');const blob=await resp.blob();const arquivo=new File([blob],nome||'documento.pdf',{type:'application/pdf'});if(navigator.canShare?.({files:[arquivo]})){await navigator.share({files:[arquivo],title:'Documento ORAQUI'});return}if(navigator.share){await navigator.share({url,title:'Documento ORAQUI'});aviso('Link temporário compartilhado; expira em 90 segundos.');return}await navigator.clipboard.writeText(url);aviso('Link temporário copiado (90 segundos).')}catch(e){if(e.name!=='AbortError')aviso('Compartilhamento indisponível: '+e.message,true)}}
</script><script>
async function iniciar(){try{const {data:{user},error:authErr}=await db.auth.getUser();if(authErr||!user)throw Error('Faça login para visualizar documentos.');const {data,error}=await db.from('documentos_colaborador').select('id,tipo,competencia,nome_arquivo,storage_path,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;const lista=data||[];if(!lista.length){$('lista').innerHTML='<div class="card">Nenhum documento disponibilizado até o momento.</div>';return}$('lista').innerHTML=lista.map(d=>`<div class="card"><strong>📄 ${esc(d.tipo)} — ${esc(d.competencia||'Sem competência')}</strong><div class="muted">${esc(d.nome_arquivo)} · ${new Date(d.created_at).toLocaleDateString('pt-BR')}</div><div class="actions" style="margin-top:12px"><button class="btn secondary" data-abrir="${d.id}">VISUALIZAR</button><button class="btn" data-share="${d.id}">COMPARTILHAR ↗</button><button class="btn secondary" data-download="${d.id}">BAIXAR</button></div></div>`).join('');const mapa=new Map(lista.map(x=>[String(x.id),x]));$('lista').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.abrir||b.dataset.share||b.dataset.download;const d=mapa.get(id);if(!d)return;if(b.dataset.abrir)await abrirDocumento(d.storage_path);else if(b.dataset.share)await compartilharDocumento(d.storage_path,d.nome_arquivo);else{try{const url=await urlTemporaria(d.storage_path);const a=document.createElement('a');a.href=url;a.download=d.nome_arquivo;a.rel='noopener';a.click()}catch(ex){aviso(ex.message,true)}}};}catch(e){$('lista').textContent='Não foi possível carregar seus documentos.';aviso(e.message,true)}}iniciar();
</script></body></html>
